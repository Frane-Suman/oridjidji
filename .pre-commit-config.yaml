# Local ruff hooks run through uv so pre-commit and the dev environment can never
# disagree on the ruff version (no pinned second copy of ruff).

# Vendored third-party code is kept byte-for-byte as published.
exclude: ^tests/browser/vendor/

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check --fix
        entry: uv run ruff check --fix
        language: system
        types: [python]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: detect-private-key
      # Guards the "never commit weights or corpora" rule at the git layer.
      - id: check-added-large-files
        args: [--maxkb=5000]
