# Higher-fidelity profile for machines with more RAM. Still CPU-only.
inference:
  encoder_backend: torch-fp32
  causal_backend: torch-fp16
  # Same export directory as `lite`. `encoder_backend` is not read by the encoder loader:
  # both profiles serve the FP32 ONNX export, so `torch-fp32` above is a declaration this
  # profile does not honour; serving un-exported safetensors would need a second
  # inference path.
  model_dir: data/processed/models
