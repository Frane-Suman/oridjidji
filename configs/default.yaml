# Base configuration; a selected profile overlays these keys.
language: hr
seed: 42
# The length study returned 50 words under its AUROC rule. The application
# ships 100 because sensitivity at a strict false-positive
# operating point was weaker for 50-word texts. This is a product choice.
min_word_count: 100
inference:
  device: cpu
  # The served encoder reads the first 160 tokens. Longer documents are
  # classified using that opening rather than a full-document encoder pass.
  max_tokens: 160
  # The best value depends on the processor; other processors may need a new setting.
  intra_op_threads: 8
