# Fast suite only: unit tests with zero model downloads.
# NOTE: unverifiable until the repo gets a GitHub remote.
name: ci

on:
  push:
  pull_request:

jobs:
  fast-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run ruff check.
      - run: uv run ruff format --check.
      - run: uv run mypy src
      - run: uv run pytest -q -m "not slow"
