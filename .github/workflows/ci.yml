# Fast suite only: no model downloads and no weights involved.
# The browser tests skip themselves when no system browser is present, which is the case on
# the runner, so this job covers lint, types and the unit suite.
name: ci

on:
  push:
  pull_request:

jobs:
  fast-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -q -m "not slow"
