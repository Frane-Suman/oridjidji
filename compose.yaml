services:
  detector:
    build:
      context: .
    environment:
      ORIDJIDJI_PROFILE: ${ORIDJIDJI_PROFILE:-lite}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # The image contains runtime code only. Set this host path to the portable
      # candidate directory produced by finalize_advanced_candidate.py.
      - ${ORIDJIDJI_CANDIDATE_ROOT:-./data/processed/models/empty}:/models:ro
      - ${ORIDJIDJI_HISTORY_DIR:-./data/processed/history}:/models/history
      - ./data/lexicons:/models/data/lexicons:ro
    restart: unless-stopped
